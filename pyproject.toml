[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "webrtrace"
# Single-sourced from webrtrace/__init__.py so the packaged version and the runtime
# __version__ can never disagree.
dynamic = ["version"]
description = "Causality tracing for multi-agent AI systems: find the node that broke the chain."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emilio Briones", email = "eabriones@miners.utep.edu" }]
keywords = [
    "observability",
    "tracing",
    "llm",
    "agents",
    "multi-agent",
    "hallucination",
    "debugging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# Deliberately empty. webR is a debugging dependency; it must never drag
# third-party packages into a user's environment. See docs/adr/0001.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Milol0608/webR"
Issues = "https://github.com/Milol0608/webR/issues"
Changelog = "https://github.com/Milol0608/webR/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "webrtrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["webrtrace"]

[tool.ruff]
line-length = 100
target-version = "py310"
# ruff 0.16 began formatting Markdown code blocks by default. The snippets in README and
# the docs are hand-laid-out for teaching -- `...` on its own line, aligned comments -- and
# collapsing them would hurt readability, so ruff is kept to Python files only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Performance assertions are excluded by default. Wall-clock thresholds are meaningful on
# a quiet machine and merely flaky on a shared CI runner; run them with `-m perf`.
addopts = "-q -m 'not perf'"
markers = ["perf: wall-clock overhead assertions; excluded from the default run"]
